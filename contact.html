<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogheswar | Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">yoghe<span>swar</span></a>
            <nav class="nav-menu">
                <ul class="nav-links">
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="about.html#skills" class="nav-link">Skills</a></li>

                </ul>
            </nav>
            <div class="nav-actions">
                <a href="contact.html" class="btn btn-hire">Hire me &rarr;</a>
            </div>
        </div>
    </header>

    <section id="contact" class="contact-section">
        <div class="container">
            <div class="contact-header">
                <span class="info-subtitle">GET IN TOUCH</span>
            </div>
            <div class="contact-form-wrapper">
                <form id="contact-form" action="#" method="POST" class="contact-form">
                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" id="name" name="name" placeholder="Yogheswar" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="Project inquiry">
                    </div>
                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" rows="5" placeholder="Tell me about your project..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-submit">
                        Send message &rarr;
                    </button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-contact-list">
                    <div class="footer-contact-item">
                        <strong>Email:</strong> <a href="mailto:yogheswarthangapandian@gmail.com">yogheswarthangapandian@gmail.com</a>
                    </div>
                    <div class="footer-contact-item">
                        <strong>Phone:</strong> <a href="tel:+919994463950">+91 9994463950</a>
                    </div>
                    <div class="footer-contact-item">
                        <strong>Location:</strong> Coimbatore, India
                    </div>
                    <div class="footer-contact-item">
                        <strong>GitHub:</strong> <a href="https://github.com/yogheswar" target="_blank" rel="noopener noreferrer">github.com/yogheswar</a>
                    </div>
                </div>
                <div class="footer-links-list">
                    <a href="about.html">About</a>
                    <a href="about.html#skills">Skills</a>
                    <a href="projects.html">Projects</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
            <div class="footer-bottom-bar">
                <p class="copyright">&copy; 2026 Yogheswar. Designed &amp; built by student.</p>
            </div>
        </div>
    </footer>
</body>
</html>
